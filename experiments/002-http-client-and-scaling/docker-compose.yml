services:
  java:
    build:
      context: .
      dockerfile: java/Dockerfile
    environment:
      PORT: "8080"
      DOWNSTREAM_URL: "${DOWNSTREAM_URL:-http://downstream:8080/io}"
      DOWNSTREAM_TIMEOUT_MS: "${DOWNSTREAM_TIMEOUT_MS:-500}"
      FANOUT_MAX_IN_FLIGHT: "${FANOUT_MAX_IN_FLIGHT:-256}"
      FANOUT_MAX_BRANCHES_IN_FLIGHT: "${FANOUT_MAX_BRANCHES_IN_FLIGHT:-256}"
      JAVA_HTTP_CLIENT_VARIANT: "${JAVA_HTTP_CLIENT_VARIANT:-sync}"
      JAVA_TOOL_OPTIONS: "-Djdk.httpclient.connectionPoolSize=100 -Djdk.httpclient.keepalive.timeout=30 ${JAVA_JFR_OPTIONS:-}"
    ports:
      - "8081:8080"
    volumes:
      - "${PROFILE_HOST_DIR:-/tmp/sut-profiles}:/profiles"
    cpus: "${SUT_CPUS:-1.0}"
    mem_limit: 512m
    restart: "no"

  go:
    build:
      context: .
      dockerfile: go/Dockerfile
    environment:
      PORT: "8080"
      DOWNSTREAM_URL: "${DOWNSTREAM_URL:-http://downstream:8080/io}"
      DOWNSTREAM_TIMEOUT_MS: "${DOWNSTREAM_TIMEOUT_MS:-500}"
      FANOUT_MAX_IN_FLIGHT: "${FANOUT_MAX_IN_FLIGHT:-256}"
      FANOUT_MAX_BRANCHES_IN_FLIGHT: "${FANOUT_MAX_BRANCHES_IN_FLIGHT:-256}"
      PPROF_ADDR: "${PPROF_ADDR:-}"
    ports:
      - "8082:8080"
      - "6060:6060"
    cpus: "${SUT_CPUS:-1.0}"
    mem_limit: 512m
    restart: "no"

  downstream:
    build:
      context: .
      dockerfile: infrastructure/downstream/Dockerfile
    environment:
      PORT: "8080"
      DOWNSTREAM_MODE: "${DOWNSTREAM_MODE:-success}"
      DOWNSTREAM_MAX_IN_FLIGHT: "${DOWNSTREAM_MAX_IN_FLIGHT:-0}"
    cpus: "0.5"
    mem_limit: 128m
    restart: "no"

  loadgen:
    build:
      context: .
      dockerfile: workloads/vegeta/Dockerfile
    cpus: "1.0"
    mem_limit: 512m
    restart: "no"
