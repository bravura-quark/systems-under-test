services:
  java:
    build:
      context: .
      dockerfile: java/Dockerfile
    environment:
      PORT: "8080"
      DOWNSTREAM_URL: "${DOWNSTREAM_URL:-http://downstream:8080/io}"
      DOWNSTREAM_TIMEOUT_MS: "${DOWNSTREAM_TIMEOUT_MS:-500}"
      JAVA_TOOL_OPTIONS: "-Djdk.httpclient.connectionPoolSize=100 -Djdk.httpclient.keepalive.timeout=30"
    ports:
      - "8081:8080"
    cpus: "1.0"
    mem_limit: 512m
    restart: "no"

  go:
    build:
      context: .
      dockerfile: go/Dockerfile
    environment:
      PORT: "8080"
      DOWNSTREAM_URL: "${DOWNSTREAM_URL:-http://downstream:8080/io}"
      DOWNSTREAM_TIMEOUT_MS: "${DOWNSTREAM_TIMEOUT_MS:-500}"
    ports:
      - "8082:8080"
    cpus: "1.0"
    mem_limit: 512m
    restart: "no"

  downstream:
    build:
      context: .
      dockerfile: infrastructure/downstream/Dockerfile
    environment:
      PORT: "8080"
      DOWNSTREAM_MODE: "${DOWNSTREAM_MODE:-success}"
      DOWNSTREAM_MAX_IN_FLIGHT: "${DOWNSTREAM_MAX_IN_FLIGHT:-0}"
    cpus: "0.5"
    mem_limit: 128m
    restart: "no"

  loadgen:
    build:
      context: .
      dockerfile: workloads/vegeta/Dockerfile
    cpus: "1.0"
    mem_limit: 512m
    restart: "no"
